<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1" fill="#4f46e5" fill-opacity="0.4" />
    </pattern>

    <!-- Dynamic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes scan-line {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(360px); opacity: 0; }
    }
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb {
      animation: pulse-glow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner {
      animation: scan-line 6s linear infinite;
    }
    .rotating-hub {
      animation: rotate-radar 20s linear infinite;
      transform-origin: 980px 180px;
    }
    .floating-box-1 {
      animation: float-badge 3.5s ease-in-out infinite;
    }
    .floating-box-2 {
      animation: float-badge 4s ease-in-out infinite 1s;
    }
    .floating-box-3 {
      animation: float-badge 3.8s ease-in-out infinite 2s;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dash-flow 2s linear infinite;
    }
    .title-font {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-font {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .code-font {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="360" fill="url(#tech-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="980" cy="180" r="180" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="600" cy="60" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Scanning Sweep Bar (Dynamic) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#glow-line)" stroke-width="2" class="scanner" filter="url(#glow-soft)" />

  <!-- Right Side: Dependency Automation Hub Graphic -->
  <g opacity="0.85">
    <circle cx="980" cy="180" r="120" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4, 4" />
    <circle cx="980" cy="180" r="85" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.6" />
    <circle cx="980" cy="180" r="50" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8, 4" class="flow-line" />
    
    <g class="rotating-hub">
      <path d="M 980 180 L 1090 140 A 120 120 0 0 0 980 60 Z" fill="url(#primary-grad)" opacity="0.18" />
      <line x1="980" y1="180" x2="1090" y2="140" stroke="#ec4899" stroke-width="2" opacity="0.8" />
    </g>

    <circle cx="980" cy="180" r="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" filter="url(#glow-soft)" />
    <circle cx="980" cy="180" r="8" fill="#38bdf8" />

    <line x1="980" y1="180" x2="910" y2="100" stroke="#6366f1" stroke-width="1.5" class="flow-line" />
    <circle cx="910" cy="100" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="910" y="104" fill="#38bdf8" font-size="10" text-anchor="middle" class="code-font">PR</text>

    <line x1="980" y1="180" x2="1060" y2="110" stroke="#a855f7" stroke-width="1.5" class="flow-line" />
    <circle cx="1060" cy="110" r="12" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="1060" y="114" fill="#f472b6" font-size="10" text-anchor="middle" class="code-font">SCA</text>

    <line x1="980" y1="180" x2="940" y2="260" stroke="#ec4899" stroke-width="1.5" class="flow-line" />
    <circle cx="940" cy="260" r="12" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="940" y="264" fill="#c084fc" font-size="10" text-anchor="middle" class="code-font">BOT</text>

    <line x1="980" y1="180" x2="1055" y2="245" stroke="#3b82f6" stroke-width="1.5" class="flow-line" />
    <circle cx="1055" cy="245" r="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="1055" y="249" fill="#60a5fa" font-size="9" text-anchor="middle" class="code-font">SBOM</text>
  </g>

  <!-- Left / Main Content -->
  <g transform="translate(80, 0)">
    <g transform="translate(0, 52)" class="floating-box-1">
      <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" fill="#c7d2fe" font-size="13" class="code-font">AUTONOMOUS UPGRADE OPS</text>
    </g>

    <text x="0" y="145" fill="#ffffff" font-size="44" class="title-font">
      Awesome Dependency
    </text>
    <text x="0" y="196" fill="url(#primary-grad)" font-size="44" class="title-font" filter="url(#glow-soft)">
      Update Automation
    </text>

    <text x="0" y="238" fill="#9ca3af" font-size="16" class="sub-font">
      Curated ecosystem of SaaS platforms &amp; Open-Source bots for automated PRs,
    </text>
    <text x="0" y="262" fill="#9ca3af" font-size="16" class="sub-font">
      vulnerability remediation, SCA intelligence, supply-chain security &amp; code refactoring.
    </text>

    <g transform="translate(0, 290)">
      <g transform="translate(0, 0)" class="floating-box-1">
        <rect width="130" height="28" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="65" y="18" fill="#38bdf8" font-size="12" text-anchor="middle" class="code-font">🤖 Auto-PR Bots</text>
      </g>
      <g transform="translate(142, 0)" class="floating-box-2">
        <rect width="125" height="28" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="62" y="18" fill="#a78bfa" font-size="12" text-anchor="middle" class="code-font">🛡️ SCA &amp; SBOM</text>
      </g>
      <g transform="translate(279, 0)" class="floating-box-3">
        <rect width="145" height="28" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="72" y="18" fill="#f472b6" font-size="12" text-anchor="middle" class="code-font">⚡ Modernization</text>
      </g>
      <g transform="translate(436, 0)" class="floating-box-2">
        <rect width="150" height="28" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="75" y="18" fill="#34d399" font-size="12" text-anchor="middle" class="code-font">🔒 Supply Chain</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primary-grad)" />
</svg>
